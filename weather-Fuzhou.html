<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福州实时天气 - 嘟嘟猪</title>
    <meta name="description" content="福州市实时天气查询，气温、湿度、风向风速一目了然，数据来自 OpenWeatherMap。">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://webpage.dudufashion.cloudns.ph/weather-Fuzhou.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="嘟嘟猪">
    <meta property="og:title" content="福州实时天气 - 嘟嘟猪">
    <meta property="og:description" content="福州市实时天气查询。">
    <meta property="og:url" content="https://webpage.dudufashion.cloudns.ph/weather-Fuzhou.html">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .weather { background: #f0f0f0; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="weather">
        <h1>当前天气</h1>
        <div id="weather-data">加载中...</div>
    </div>

    <script>
        // 替换为你的API密钥和城市
        const API_KEY = "8321f900611d373f58039530b8a1a9ae";
        const CITY = "Fuzhou,CN";

        // 示例：使用OpenWeatherMap API
        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY}&appid=${API_KEY}&units=metric`)
            .then(response => response.json())
            .then(data => {
                const weatherDiv = document.getElementById('weather-data');
                weatherDiv.innerHTML = `
                    <p>城市：${data.name}</p>
                    <p>温度：${data.main.temp}°C</p>
                    <p>天气：${data.weather[0].description}</p>
                    <p>湿度：${data.main.humidity}%</p>
                `;
            })
            .catch(error => {
                console.error('获取天气失败：', error);
                document.getElementById('weather-data').innerHTML = "天气加载失败";
            });
    </script>
    <script src="static/js/common.js"></script>
</body>
</html>
