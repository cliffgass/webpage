<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时天气查询 - 嘟嘟猪</title>
    <meta name="description" content="免费在线实时天气查询，支持定位与手动输入城市，数据来自 OpenWeatherMap，无需注册。">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://webpage.dudufashion.cloudns.ph/weather-openweathermap.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="嘟嘟猪">
    <meta property="og:title" content="实时天气查询 - 嘟嘟猪">
    <meta property="og:description" content="免费在线实时天气查询，支持定位与手动输入城市。">
    <meta property="og:url" content="https://webpage.dudufashion.cloudns.ph/weather-openweathermap.html">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .weather { background: #f0f0f0; padding: 20px; border-radius: 10px; width: 300px; }
        #city-input { margin-top: 10px; padding: 5px; width: 80%; }
        button { margin-top: 10px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="weather">
        <h1>当前天气</h1>
        <div id="weather-data">正在获取您的位置...</div>
        <input type="text" id="city-input" placeholder="手动输入城市（如：北京市）">
        <button onclick="getWeatherByCity()">查询天气</button>
    </div>

    <script>
        const API_KEY = "8321f900611d373f58039530b8a1a9ae";
        const QWEATHER_KEY = "d6a480091f2249fbb54ed3f04a4f1d74";

        // 风速统一换算为公里/小时(km/h)，并附带中国常用的风力等级(蒲福风级)
        function windLevel(kmh) {
            const thresholds = [1, 5, 11, 19, 28, 38, 49, 61, 74, 88, 102, 117];
            let level = 0;
            thresholds.forEach(t => { if (kmh > t) level++; });
            return level;
        }

        // 统一用经纬度查询天气（最准确，避免城市名歧义导致数据错误）
        async function getWeatherByCoords(lat, lon, label) {
            const weatherDiv = document.getElementById('weather-data');
            weatherDiv.innerHTML = "正在加载天气数据...";
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=zh_cn`
                );
                if (!response.ok) throw new Error(`查询失败: ${response.status}`);
                const data = await response.json();
                const location = label || `${data.name}${data.sys.country ? "，" + data.sys.country : ""}`;
                weatherDiv.innerHTML = `
                    <p>位置：${location}</p>
                    <p>温度：${data.main.temp}°C</p>
                    <p>体感温度：${data.main.feels_like}°C</p>
                    <p>天气：${data.weather[0].description}</p>
                    <p>湿度：${data.main.humidity}%</p>
                    <p>风速：${(data.wind.speed * 3.6).toFixed(1)} 公里/小时（${windLevel(data.wind.speed * 3.6)}级风）</p>
                `;
            } catch (error) {
                console.error("获取天气失败:", error);
                weatherDiv.innerHTML = "天气数据加载失败，请稍后重试或手动输入城市";
            }
        }

        // 手动输入城市查询天气：用和风天气解析中文城市，再用 OpenWeatherMap 查天气
        async function getWeatherByCity() {
            const city = document.getElementById('city-input').value.trim();
            if (!city) return;

            try {
                const geoRes = await fetch(
                    `https://geoapi.qweather.com/v2/city/lookup?location=${encodeURIComponent(city)}&key=${QWEATHER_KEY}`
                );
                if (!geoRes.ok) throw new Error(`地理编码失败: ${geoRes.status}`);
                const geoData = await geoRes.json();

                if (geoData.code !== "200" || !geoData.location || !geoData.location.length) {
                    throw new Error("未找到该城市");
                }

                const loc = geoData.location[0];
                const label = `${loc.country}·${loc.adm1}·${loc.adm2}·${loc.name}`;
                await getWeatherByCoords(loc.lat, loc.lon, label);
            } catch (error) {
                console.error("查询失败:", error);
                document.getElementById('weather-data').innerHTML = "城市未找到，请尝试输入如「福州」「北京」等城市名";
            }
        }

        // 页面加载时自动定位
        function getLocation() {
            if (!navigator.geolocation) {
                document.getElementById('weather-data').innerHTML = "浏览器不支持地理定位";
                return;
            }
            navigator.geolocation.getCurrentPosition(async position => {
                const { latitude: lat, longitude: lon } = position.coords;

                // 使用和风天气地理编码获取中文位置名称（OpenWeatherMap 反向编码只返回拼音/英文名）
                let label = "";
                try {
                    const res = await fetch(
                        `https://geoapi.qweather.com/v2/city/lookup?location=${lon},${lat}&key=${QWEATHER_KEY}`
                    );
                    const data = await res.json();
                    if (data.code === "200" && data.location && data.location.length > 0) {
                        const loc = data.location[0];
                        label = `${loc.country}·${loc.adm1}·${loc.adm2}·${loc.name}`;
                    }
                } catch (error) {
                    console.error("中文位置解析失败:", error);
                }
                await getWeatherByCoords(lat, lon, label);
            }, error => {
                console.error("定位失败:", error);
                document.getElementById('weather-data').innerHTML = "自动定位失败，请手动输入城市";
            });
        }

        // 输入框按回车直接查询
        document.getElementById('city-input').addEventListener('keydown', e => {
            if (e.key === "Enter") getWeatherByCity();
        });

        window.onload = getLocation;
    </script>
    <script src="static/js/common.js"></script>
</body>
</html>
