<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>实时天气</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .weather { background: #f0f0f0; padding: 20px; border-radius: 10px; width: 300px; }
        #city-input { margin-top: 10px; padding: 5px; width: 80%; }
        button { margin-top: 10px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="weather">
        <h1>当前天气</h1>
        <div id="weather-data">正在获取您的位置...</div>
        <input type="text" id="city-input" placeholder="手动输入城市（如：北京市）">
        <button onclick="getWeatherByCity()">查询天气</button>
    </div>

    <script>
        const API_KEY = "8321f900611d373f58039530b8a1a9ae";

        // 统一用经纬度查询天气（最准确，避免城市名歧义导致数据错误）
        async function getWeatherByCoords(lat, lon, label) {
            const weatherDiv = document.getElementById('weather-data');
            weatherDiv.innerHTML = "正在加载天气数据...";
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=zh_cn`
                );
                if (!response.ok) throw new Error(`查询失败: ${response.status}`);
                const data = await response.json();
                const location = label || `${data.name}${data.sys.country ? "，" + data.sys.country : ""}`;
                weatherDiv.innerHTML = `
                    <p>位置：${location}</p>
                    <p>温度：${data.main.temp}°C</p>
                    <p>体感温度：${data.main.feels_like}°C</p>
                    <p>天气：${data.weather[0].description}</p>
                    <p>湿度：${data.main.humidity}%</p>
                    <p>风速：${data.wind.speed} m/s</p>
                `;
            } catch (error) {
                console.error("获取天气失败:", error);
                weatherDiv.innerHTML = "天气数据加载失败，请稍后重试或手动输入城市";
            }
        }

        // 手动输入城市查询天气：先解析中文城市名为经纬度，再查天气
        async function getWeatherByCity() {
            const city = document.getElementById('city-input').value.trim();
            if (!city) return;

            try {
                const geoRes = await fetch(
                    `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(city)},CN&limit=1&appid=${API_KEY}`
                );
                if (!geoRes.ok) throw new Error(`地理编码失败: ${geoRes.status}`);
                const geoData = await geoRes.json();

                if (!geoData.length) throw new Error("未找到该城市");

                const loc = geoData[0];
                const label = `${loc.name}${loc.state ? "·" + loc.state : ""}${loc.country ? "·" + loc.country : ""}`;
                await getWeatherByCoords(loc.lat, loc.lon, label);
            } catch (error) {
                console.error("查询失败:", error);
                document.getElementById('weather-data').innerHTML = "城市未找到，请尝试输入如「福州」「北京」等城市名";
            }
        }

        // 页面加载时自动定位
        function getLocation() {
            if (!navigator.geolocation) {
                document.getElementById('weather-data').innerHTML = "浏览器不支持地理定位";
                return;
            }
            navigator.geolocation.getCurrentPosition(async position => {
                const { latitude: lat, longitude: lon } = position.coords;

                // 反向地理编码仅用于显示位置名称，天气数据直接用经纬度查询
                let label = "";
                try {
                    const res = await fetch(
                        `https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&limit=1&appid=${API_KEY}`
                    );
                    const data = await res.json();
                    if (data.length > 0) {
                        const loc = data[0];
                        label = `${loc.name}${loc.state ? "·" + loc.state : ""}${loc.country ? "·" + loc.country : ""}`;
                    }
                } catch (error) {
                    console.error("反向地理编码失败:", error);
                }
                await getWeatherByCoords(lat, lon, label);
            }, error => {
                console.error("定位失败:", error);
                document.getElementById('weather-data').innerHTML = "自动定位失败，请手动输入城市";
            });
        }

        // 输入框按回车直接查询
        document.getElementById('city-input').addEventListener('keydown', e => {
            if (e.key === "Enter") getWeatherByCity();
        });

        window.onload = getLocation;
    </script>
</body>
</html>
